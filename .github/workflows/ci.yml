name: CI - Mini SCADA

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar MinGW
        run: choco install mingw -y

      - name: Compilar dispositivo
        run: |
          g++ dispositivo_cpp/src/main.cpp dispositivo_cpp/src/Bomba.cpp dispositivo_cpp/src/Alarme.cpp dispositivo_cpp/src/EstacaoBombeamento.cpp dispositivo_cpp/src/ControlePadrao.cpp dispositivo_cpp/src/JsonExporter.cpp -o dispositivo_cpp/estacao.exe

      - name: Compilar testes
        run: |
          g++ dispositivo_cpp/tests/test_regras.cpp dispositivo_cpp/src/Bomba.cpp dispositivo_cpp/src/Alarme.cpp dispositivo_cpp/src/EstacaoBombeamento.cpp dispositivo_cpp/src/ControlePadrao.cpp -o dispositivo_cpp/tests/test_regras.exe

      - name: Executar testes
        run: |
          dispositivo_cpp/tests/test_regras.exe